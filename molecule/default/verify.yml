---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Read the installed package version
      ansible.builtin.command:
        argv: [caddy, version]
      changed_when: false
      register: verify_version

    - name: Read the service state and identity
      ansible.builtin.systemd_service:
        name: caddy.service
        daemon_reload: false
      register: verify_service

    - name: Verify the service runs as caddy and starts at boot
      ansible.builtin.assert:
        that:
          - verify_service.status.ActiveState == 'active'
          - verify_service.status.UnitFileState == 'enabled'
          - verify_service.status.User == 'caddy'
          - verify_service.status.MainPID | int > 0
        quiet: true

    - name: Inspect the global configuration and state paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - {path: /etc/caddy, owner: root, group: caddy, mode: "0750"}
        - {path: /etc/caddy/Caddyfile, owner: root, group: caddy, mode: "0640"}
        - {path: /etc/caddy/sites.d, owner: root, group: caddy, mode: "0750"}
        - {path: /etc/caddy/snippets, owner: root, group: caddy, mode: "0750"}
        - {path: /var/lib/caddy, owner: caddy, group: caddy, mode: "0700"}
      register: verify_paths

    - name: Verify restrictive ownership and permissions
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
        quiet: true
      loop: "{{ verify_paths.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Check the listening administration endpoint
      ansible.builtin.command:
        argv: [ss, -H, -ltn, 'sport = :2019']
      register: verify_admin
      changed_when: false

    - name: Require an administration listener
      ansible.builtin.assert:
        that: verify_admin.stdout_lines | length > 0

    - name: Verify administration is bound to loopback only
      ansible.builtin.assert:
        that:
          - item.split()[3] in ['127.0.0.1:2019', '[::1]:2019']
        quiet: true
      loop: "{{ verify_admin.stdout_lines }}"

    - name: Probe each independent virtual host
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        headers:
          Host: "{{ item.name }}"
        return_content: true
        use_proxy: false
        status_code: 200
      loop:
        - {name: 'first.example.test:8080', body: first site}
        - {name: 'second.example.test:8080', body: second site}
      register: verify_http
      until: verify_http.status | default(0) == 200
      retries: 10
      delay: 1

    - name: Verify correct hostname routing
      ansible.builtin.assert:
        that: item.content == item.item.body
        quiet: true
      loop: "{{ verify_http.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Read the active Caddyfile before the rejection test
      ansible.builtin.slurp:
        src: /etc/caddy/Caddyfile
      register: verify_previous

    - name: Exercise candidate rejection and preserve the working configuration
      block:
        - name: Introduce an invalid imported fixture without reloading
          ansible.builtin.copy:
            dest: /etc/caddy/sites.d/invalid-test.caddy
            content: |
              http://invalid.example.test:8080 {
                  invalid_directive_for_molecule
              }
            owner: root
            group: caddy
            mode: "0640"

        - name: Attempt to activate a changed global configuration
          block:
            - name: Apply the foundation with a new email
              ansible.builtin.include_role:
                name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
              vars:
                caddy_email: changed@example.org
          rescue:
            - name: Record expected failure at candidate validation
              ansible.builtin.set_fact:
                verify_candidate_rejected: "{{ 'Validate the candidate before changing the active file' in ansible_failed_task.name }}"

        - name: Assert that the invalid candidate was rejected
          ansible.builtin.assert:
            that: verify_candidate_rejected | default(false) | bool

        - name: Read the retained global configuration
          ansible.builtin.slurp:
            src: /etc/caddy/Caddyfile
          register: verify_retained

        - name: Verify the global file was not replaced
          ansible.builtin.assert:
            that: verify_retained.content == verify_previous.content

        - name: Verify the running service still responds
          ansible.builtin.uri:
            url: http://127.0.0.1:8080/
            headers:
              Host: first.example.test:8080
            return_content: true
            use_proxy: false
          register: verify_live
          failed_when: verify_live.content != 'first site'
      always:
        - name: Remove the invalid test fixture
          ansible.builtin.file:
            path: /etc/caddy/sites.d/invalid-test.caddy
            state: absent

    - name: Apply a valid global change and reload gracefully
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        caddy_email: changed@example.org

    - name: Check the service after global reconfiguration
      ansible.builtin.systemd_service:
        name: caddy.service
        daemon_reload: false
      register: verify_reloaded

    - name: Verify no process restart occurred
      ansible.builtin.assert:
        that:
          - verify_reloaded.status.ActiveState == 'active'
          - verify_reloaded.status.MainPID == verify_service.status.MainPID

    - name: Verify site fragments still respond after the global reload
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        headers:
          Host: "{{ item.name }}"
        return_content: true
        use_proxy: false
      loop:
        - {name: 'first.example.test:8080', body: first site}
        - {name: 'second.example.test:8080', body: second site}
      register: verify_preserved
      failed_when: verify_preserved.content != item.body

    - name: Restore the scenario's original global configuration
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        caddy_email: admin@example.org
