---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # images:debian/13 has neither Python, which Ansible modules need, nor
    # sudo, which become needs. iproute2 supplies ss for the verify step.
    - name: Install Python and sudo
      ansible.builtin.raw: >-
        (command -v python3 && command -v sudo && command -v ss) >/dev/null ||
        (apt-get update -q && apt-get install -y -q python3 sudo iproute2)
      changed_when: false
